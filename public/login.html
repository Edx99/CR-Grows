<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — CR Grows</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-dark:   #1a3a2a;
      --green-mid:    #2d6a4f;
      --green-accent: #52b788;
      --cream:        #f8f5f0;
      --sand:         #e8e0d4;
      --text:         #1c1c1c;
      --text-soft:    #5c5c5c;
      --error:        #c0392b;
      --radius:       12px;
    }

    body {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      font-family: 'Inter', sans-serif;
      background: var(--cream);
      color: var(--text);
    }

    /* ── LEFT PANEL ── */
    .panel-left {
      background: var(--green-dark);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 56px 52px;
      position: relative;
      overflow: hidden;
    }

    .panel-left::before {
      content: '';
      position: absolute;
      width: 420px; height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle, #2d6a4f55 0%, transparent 70%);
      top: -80px; left: -80px;
    }

    .panel-left::after {
      content: '';
      position: absolute;
      width: 300px; height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, #52b78822 0%, transparent 70%);
      bottom: 60px; right: -60px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 1;
    }

    .brand-icon {
      width: 40px; height: 40px;
      background: var(--green-accent);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }

    .brand-name {
      font-family: 'DM Serif Display', serif;
      font-size: 22px;
      color: #fff;
      letter-spacing: 0.01em;
    }

    .panel-quote {
      position: relative;
      z-index: 1;
    }

    .panel-quote blockquote {
      font-family: 'DM Serif Display', serif;
      font-size: 34px;
      line-height: 1.3;
      color: #fff;
      margin-bottom: 24px;
    }

    .panel-quote blockquote em {
      color: var(--green-accent);
      font-style: normal;
    }

    .panel-quote p {
      font-size: 14px;
      color: #a8c4b2;
      line-height: 1.6;
      max-width: 360px;
    }

    .leaf-strip {
      display: flex;
      gap: 8px;
      margin-top: 32px;
    }

    .leaf-strip span {
      display: inline-block;
      width: 32px; height: 4px;
      border-radius: 2px;
      background: var(--green-accent);
      opacity: 0.5;
    }
    .leaf-strip span:first-child { opacity: 1; width: 48px; }

    /* ── RIGHT PANEL ── */
    .panel-right {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 56px 64px;
    }

    .form-header {
      margin-bottom: 40px;
    }

    .form-header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 32px;
      color: var(--green-dark);
      margin-bottom: 8px;
    }

    .form-header p {
      font-size: 15px;
      color: var(--text-soft);
    }

    .form-header p a {
      color: var(--green-mid);
      font-weight: 600;
      text-decoration: none;
    }
    .form-header p a:hover { text-decoration: underline; }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid var(--sand);
      border-radius: var(--radius);
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      background: #fff;
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    input:focus {
      border-color: var(--green-accent);
      box-shadow: 0 0 0 3px #52b78820;
    }

    .field-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .field-row label { margin-bottom: 0; }

    .forgot-link {
      font-size: 13px;
      color: var(--green-mid);
      font-weight: 500;
      text-decoration: none;
    }
    .forgot-link:hover { text-decoration: underline; }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--green-dark);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: 0.01em;
    }

    .btn-primary:hover { background: var(--green-mid); }
    .btn-primary:active { transform: scale(0.99); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: var(--text-soft);
      font-size: 13px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--sand);
    }

    .error-msg {
      background: #fdf0ef;
      border: 1px solid #f5c6c2;
      color: var(--error);
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .success-msg {
      background: #edf7f1;
      border: 1px solid #a8d5bb;
      color: var(--green-mid);
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      body { grid-template-columns: 1fr; }
      .panel-left { display: none; }
      .panel-right { padding: 40px 28px; }
    }
  </style>
</head>
<body>

  <!-- LEFT -->
  <div class="panel-left">
    <div class="brand">
      <div class="brand-icon">🌱</div>
      <span class="brand-name">CR Grows</span>
    </div>

    <div class="panel-quote">
      <blockquote>Every great journey starts with a <em>single step</em>.</blockquote>
      <p>Welcome back. Your projects, data, and team are waiting for you inside.</p>
      <div class="leaf-strip">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="panel-right">
    <div class="form-header">
      <h1>Sign in</h1>
      <p>Don't have an account? <a href="register.html">Create one</a></p>
    </div>

    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email"/>
    </div>

    <div class="field">
      <div class="field-row">
        <label for="password">Password</label>
        <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
      </div>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
    </div>

    <button class="btn-primary" id="loginBtn" onclick="handleLogin()">Sign in</button>

    <div class="divider">or</div>

    <p style="text-align:center; font-size:14px; color:var(--text-soft);">
      New here? <a href="register.html" style="color:var(--green-mid);font-weight:600;text-decoration:none;">Create a free account →</a>
    </p>
  </div>

  <script>
    async function handleLogin() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('loginBtn');
      const errEl    = document.getElementById('errorMsg');
      const okEl     = document.getElementById('successMsg');

      errEl.style.display = 'none';
      okEl.style.display  = 'none';

      if (!email || !password) {
        showError('Please fill in all fields.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Signing in…';

      try {
        const res  = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          showError(data.error || 'Invalid credentials. Please try again.');
        } else {
          localStorage.setItem('token', data.token);
          okEl.textContent = 'Signed in! Redirecting…';
          okEl.style.display = 'block';
          setTimeout(() => window.location.href = 'dashboard.html', 800);
        }
      } catch {
        showError('Network error. Please try again.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
    }

    // Allow Enter key to submit
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLogin();
    });
  </script>
</body>
</html>
